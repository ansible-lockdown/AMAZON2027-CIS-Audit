---

{{ if .Vars.amzn2027cis_level_2 }}
  {{ if .Vars.amzn2027cis_rule_6_2_4_10 }}
command:
  audit_tools_group:
    title: 6.2.4.10 | Ensure audit tools group owner is configured
    exec: 'stat -Lc ''%n %G'' /usr/bin/auditctl /usr/bin/aureport /usr/bin/ausearch /usr/bin/auditd /usr/bin/augenrules | awk ''$2 != "root" {print}'' | wc -l'
    exit-status: 0
    stdout:
    - '/^0$/'
    meta:
      server: 2
      workstation: NA
      CIS_ID:
      - 6.2.4.10
      CISv8:
      - 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: AU-9
  {{ end }}
{{ end }}
