---

{{ if .Vars.amzn2027cis_level_1 }}
  {{ if .Vars.amzn2027cis_rule_1_2_1_1 }}
command:
  gpg_keys:
    title: 1.2.1.1 | Ensure GPG keys are configured | Amazon Linux 2027 release key installed
    exec: rpm -q gpg-pubkey --queryformat '%{VERSION} %{PACKAGER}\n'
    exit-status: 0
    stdout:
    - '/^37ce7c3833e5a33c4a1e4b0d5408eaa4b1e92e3d Amazon Linux amazon-linux@amazon.com$/'
    meta:
      server: 1
      workstation: NA
      CIS_ID:
      - 1.2.1.1
      CISv8:
      - 7.3
      - 7.4
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5: SI-2
  {{ end }}
{{ end }}
